{% load static %}


<div class="header mb-0">
    <div class="header-left">
        <a href="#" class="logo">
            <img src="{% static 'assets/img/logo.png' %}" alt="Logo">
        </a>
        <a href="#" class="logo logo-small">
            <img src="{% static 'assets/img/logo-small.png' %}" alt="Logo" width="30" height="30">
        </a>
    </div>
    <!-- <a href="javascript:void(0);" id="toggle_btn">
    <i class="fas fa-align-left"></i>
    </a> -->
    <!-- <a class="mobile_btn" id="mobile_btn">
    <i class="fas fa-bars"></i>
    </a> -->
    <div class="row align-items-center">
        <div class="col-8 text-center text-info">
            <i>
                <h1>SCHOOL MANAGEMENT SYSTEM</h1>
            </i>
        </div>
        <div class="col-4">
            <ul class="nav user-menu">
                <li class="nav-item dropdown has-arrow">
                    <a href="#" class="dropdown-toggle nav-link" data-toggle="dropdown">
                        <span class="user-img"><img class="rounded-circle"
                                src="{% static 'assets/img/profiles/avatar-01.jpg' %}" width="31"
                                alt="Ryan Taylor"></span>
                    </a>
                    <div class="dropdown-menu">
                        <div class="user-header">
                            <div class="avatar avatar-sm">
                                <img src="{%static 'assets/img/profiles/avatar-01.jpg' %}" alt="User Image"
                                    class="avatar-img rounded-circle">
                            </div>
                            <div class="user-text">
                                <h6>{{user.first_name}}</h6>

                                {% if user.user_type == '1' %}
                                <p class="text-muted mb-0">Administrator</p>
                                {% elif user.user_type == '2' %}
                                <p class="text-muted mb-0">Staff</p>
                                {% elif user.user_type == '3' %}
                                <p class="text-muted mb-0">Student</p>
                                {% endif %}
                            </div>
                        </div>
                        <a class="dropdown-item" href="profile.html">My Profile</a>
                        <a class="dropdown-item" href="inbox.html">Inbox</a>
                        <a class="dropdown-item" href="{% url 'logout_user' %}">Logout</a>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</div>
