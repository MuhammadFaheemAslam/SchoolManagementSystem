{% extends "base.html" %}

{% block body %}

     <div class="container"> 
            <div class="content container-fluid">
               <div class="page-header">
                  <div class="row align-items-center">
                     <div class="col mt-4">
                        <i><h3 class="page-title">Student Registration Form</h3></i>                    
                     </div>
                  </div>
               </div>
               
               <div class="row">
                  <div class="col-sm-12">
                     <div class="card ">
                        <div class="card-body">
                            
                           <form method="post" action="{% url 'add_student' %}">
                              {% csrf_token %}
                              <div class="row">
                                 <div class="col-12">
                                    <h5 class="form-title"><span>Student Information</span></h5>
                                 </div>
                                 <div class=" col-sm-11">
                                    <div class="form-group">
                                       <label>First Name</label>
                                       <input type="text" class="form-control" name="first_name" required>
                                    </div>
                                 </div>
                                 <div class="col-12 col-sm-11">
                                    <div class="form-group">
                                       <label>Last Name</label>
                                       <input type="text" class="form-control" name="last_name" required>
                                    </div>
                                 </div>
                                 <div class="col-12 col-sm-11">
                                    <div class="form-group">
                                       <label>Father's Name</label>
                                       <input type="text" class="form-control" name="father_name" required>
                                    </div>
                                 </div>
                                 <div class="col-12 col-sm-11">
                                    <div class="form-group">
                                       <label>B-Form</label>
                                       <input type="number" class="form-control" name="b_form" required>
                                    </div>
                                 </div>
                                 <div class="col-12 col-sm-11">
                                    <div class="form-group">
                                       <label>Gender</label>
                                       <select class="form-control" name="gender" required>
                                          <option>Select Gender</option>
                                          <option>Female</option>
                                          <option>Male</option>
                                          <option>Others</option>
                                       </select>
                                    </div>
                                 </div>
                                 <div class="col-12 col-sm-11">
                                    <div class="form-group">
                                       <label>Date of Birth</label>
                                       <div>
                                          <input type="date" class="form-control" name="date_of_birth" required>
                                       </div>
                                    </div>
                                 </div>
                                 <div class="col-12 col-sm-11">
                                    <div class="form-group">
                                       <label>Class</label>
                                       <select class="form-control" name="classes" required>
                                          <option>Select Class</option>
                                          <option>Nursary</option>
                                          <option>prep</option>
                                          <option>One</option>
                                          <option>2nd</option>
                                          <option>3rd</option>
                                          <option>4th</option>
                                          <option>5th</option>
                                          <option>6th</option>
                                          <option>7th</option>
                                          <option>8th</option>
                                          <option>9th</option>
                                          <option>10th</option>
                                          <option>11th</option>
                                          <option>12th</option>
                                       </select>
                                    </div>
                                 </div>
                                 <div class="col-12 col-sm-11">
                                    <div class="form-group">
                                       <label>Religion</label>
                                       <input type="text" class="form-control" name="religion" >
                                    </div>
                                 </div>
                                 <div class="col-12 col-sm-11">
                                    <div class="form-group">
                                       <label>Student Image</label>
                                       <input type="file" class="form-control" name="image" >
                                    </div>
                                 </div>
                                 <div class="col-12 col-sm-11">
                                    <div class="form-group">
                                       <label>Email</label>
                                       <input type="email" class="form-control" name="email">
                                    </div>
                                 </div>
                                 <div class="col-12 col-sm-11">
                                    <div class="form-group">
                                       <label>Father's Mobile</label>
                                       <input type="phone" class="form-control" name="phone_no" required>
                                    </div>
                                 </div>
                                 <div class="col-12 col-sm-11">
                                    <div class="form-group">
                                       <label>Father's CNIC</label>
                                       <input type="integer" class="form-control" name="f_cnic" required>
                                    </div>
                                 </div>
                                 <div class="col-12 col-sm-11">
                                    <div class="form-group">
                                       <label>Address</label>
                                       <textarea class="form-control" name="address"></textarea>
                                    </div>
                                 </div>  
                                 <div class="col-12">
                                    <button type="submit" class="btn btn-primary">Submit</button>
                                 </div>
                              </div>
                           </form>
                        </div>
                        </div>
                     </div>
                  </div>
               </div>
            </div>
         </div>
   {% endblock %}
